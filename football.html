<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;}
body{overflow:hidden;font-family:'Poppins',sans-serif;background:#111;}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(to bottom,rgba(135,190,255,.45),rgba(255,255,255,.05) 35%),linear-gradient(to bottom,#59c95f 0%,#2f9337 55%,#1f6f26 100%);}
#game::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top left,rgba(255,255,255,.22),transparent 32%),radial-gradient(circle at top right,rgba(255,255,255,.18),transparent 32%),radial-gradient(circle at top center,rgba(255,255,255,.12),transparent 40%);pointer-events:none;}
#grass{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 80px,rgba(0,0,0,.02) 80px 160px);opacity:.55;}
.crowd{position:absolute;top:0;width:100%;height:26%;background:repeating-linear-gradient(90deg,#111 0 6px,#222 6px 12px,#2c2c2c 12px 18px,#151515 18px 24px);filter:blur(1px);}
.goal{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:min(72vw,580px);height:min(31vh,250px);border:8px solid white;border-bottom:none;border-radius:10px 10px 0 0;box-shadow:0 0 28px rgba(255,255,255,.4),inset 0 0 25px rgba(255,255,255,.1);}
#net{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:min(72vw,580px);height:min(31vh,250px);pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px);background-size:26px 26px;}

.shadow{position:absolute;width:70px;height:14px;background:rgba(0,0,0,.3);bottom:-4px;left:50%;transform:translateX(-50%);filter:blur(6px);border-radius:50%;}
.torso{position:absolute;width:52px;height:66px;left:50%;top:34px;transform:translateX(-50%);border-radius:14px;background:linear-gradient(to bottom,#00a2ff,#005ac7);box-shadow:inset 0 -10px 16px rgba(0,0,0,.28);}
.torso::before{content:'';position:absolute;width:7px;height:100%;background:rgba(255,255,255,.2);left:50%;transform:translateX(-50%);}
.head{position:absolute;width:36px;height:40px;left:50%;top:0;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd9b8,#dca37b);box-shadow:0 2px 5px rgba(0,0,0,.25);}
.head::before{content:'';position:absolute;top:-3px;left:0;width:100%;height:16px;background:#161616;border-radius:50% 50% 40% 40%;}
.arm{position:absolute;width:14px;height:58px;top:40px;border-radius:16px;transform-origin:top center;background:linear-gradient(to bottom,#ffd7b2,#d99668);}

.leg{position:absolute;width:16px;height:60px;bottom:0;border-radius:16px;background:linear-gradient(to bottom,#1d1d1d,#000);transform-origin:top center;}

.left-arm{left:20px;transform:rotate(14deg);}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app-check.js';
import { getAuth, signOut } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js';

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider('6LdpeVYqAAAAAA2i5yEtBFiVV3cBS9WCAin8LK3w'),
  isTokenAutoRefreshEnabled: true
});

// 🔒 TAMPER PROTECTION — same as index.html
(function() {
    const originalGetItem = localStorage.getItem;
    const originalSetItem = localStorage.setItem;

    localStorage.getItem = function(key) {
        const value = originalGetItem.call(this, key);

        if (key === 'userEmail' && value) {
            const user = auth.currentUser;
            if (user && user.email !== value) {
                console.warn('Tampered localStorage detected - clearing invalid data');
                this.removeItem('userEmail');
                this.removeItem('popupShown');
                return null;
            }
        }
        return value;
    };

    console.log("🔒 Tamper protection activated");
})();

// 🔐 LOGIN REQUIRED — kick out logged-out users, and re-check via Firebase auth state
auth.onAuthStateChanged((user) => {
    const userEmail = localStorage.getItem("userEmail");

    if (!user && !userEmail) {
        // Definitely not logged in
        window.location.href = "index.html";
    } else if (user && !user.emailVerified) {
        // Logged in but unverified — treat as not logged in
        signOut(auth).then(() => {
            localStorage.removeItem("userEmail");
            localStorage.removeItem("popupShown");
            window.location.href = "index.html";
        });
    }
});

// ⚡ Fast localStorage pre-check (runs before Firebase resolves)
(function earlyGuard() {
    const userEmail = localStorage.getItem("userEmail");
    if (!userEmail) {
        window.location.href = "index.html";
    }
})();
</script>

<script>
const ball      = document.getElementById('ball');
const keeper    = document.getElementById('keeper');
const goalEl    = document.getElementById('goalEl');
const lArm      = document.getElementById('lArm');
const rArm      = document.getElementById('rArm');
const lLeg      = document.getElementById('lLeg');
const rLeg      = document.getElementById('rLeg');
const message   = document.getElementById('message');
const scoreText = document.getElementById('score');
const timerVal  = document.getElementById('timerVal');
const gameOver  = document.getElementById('gameOver');
const finalScore= document.getElementById('finalScore');
const restartBtn= document.getElementById('restartBtn');
const playBtn   = document.getElementById('playBtn');
const startScreen = document.getElementById('startScreen');
const endScreen   = document.getElementById('endScreen');

const GAME_DURATION = 60;
let startX=0,startY=0,dragging=false,shooting=false,score=0;
let kFrac=0.5,kTarget=0.5;
let keeperDiving=false,keeperDiveDir=0,diveProgress=0;
let timeLeft=GAME_DURATION,timerInterval=null,gameActive=false;

function getGoalMetrics(){
  const r=goalEl.getBoundingClientRect();
  const g=document.getElementById('game').getBoundingClientRect();
  return{
    left:r.left-g.left+8, right:r.right-g.left-8,
    top:r.top-g.top+8, bottom:r.bottom-g.top,
    width:r.width-16, gW:g.width, gH:g.height
  };
}

function setIdlePose(){
  lArm.style.transform='rotate(14deg)';
  rArm.style.transform='rotate(-14deg)';
  lLeg.style.transform='rotate(3deg)';
  rLeg.style.transform='rotate(-3deg)';
  keeper.style.transform='none';
}

function positionKeeper(){
  const m=getGoalMetrics();
  const kW=keeper.offsetWidth, kH=keeper.offsetHeight;
  const centerX=m.left+kFrac*m.width;
  keeper.style.left=(centerX-kW/2)+'px';
  keeper.style.top=(m.bottom-kH)+'px';
}

function animateDive(){
  if(!keeperDiving)return;
  diveProgress=Math.min(1,diveProgress+0.045);
  const t=diveProgress<0.5?2*diveProgress*diveProgress:-1+(4-2*diveProgress)*diveProgress;
  kFrac+=(kTarget-kFrac)*0.15;
  positionKeeper();
  const bodyTilt=keeperDiveDir*38*t;
  const armReach=70*t;
  const legKick=22*t;
  keeper.style.transform=`rotate(${bodyTilt}deg)`;
  if(keeperDiveDir<0){
    lArm.style.transform=`rotate(${-armReach}deg)`;
    rArm.style.transform=`rotate(${20*t}deg)`;
    lLeg.style.transform=`rotate(${-legKick}deg)`;
    rLeg.style.transform=`rotate(${legKick*1.4}deg)`;
  } else {
    rArm.style.transform=`rotate(${armReach}deg)`;
    lArm.style.transform=`rotate(${-20*t}deg)`;
    rLeg.style.transform=`rotate(${legKick}deg)`;
    lLeg.style.transform=`rotate(${-legKick*1.4}deg)`;
  }
  if(diveProgress<1) requestAnimationFrame(animateDive);
}

positionKeeper();
setIdlePose();

function showMessage(txt,color){
  message.innerText=txt;
  message.style.color=color;
  message.style.opacity=1;
  setTimeout(()=>message.style.opacity=0,1300);
}

function resetBall(){
  shooting=false;
  keeperDiving=false;
  diveProgress=0;
  kTarget=kFrac;
  ball.style.transition='none';
  ball.style.left='50%';
  ball.style.bottom='13%';
  ball.style.transform='translateX(-50%) scale(1)';
  setTimeout(()=>{
    setIdlePose();
    const returnAnim=()=>{
      if(shooting)return;
      kFrac+=(0.5-kFrac)*0.04;
      positionKeeper();
      if(Math.abs(kFrac-0.5)>0.005) requestAnimationFrame(returnAnim);
    };
    requestAnimationFrame(returnAnim);
  },300);
}

function updateTimerDisplay(){
  timerVal.textContent=timeLeft;
  timerVal.className='';
  if(timeLeft<=10) timerVal.className='danger';
  else if(timeLeft<=20) timerVal.className='warning';
}

function endGame(){
  gameActive=false;
  clearInterval(timerInterval);
  timerInterval=null;
  shooting=false;
  dragging=false;
  setTimeout(()=>{
    finalScore.textContent=score;
    startScreen.style.display='none';
    endScreen.style.display='block';
    gameOver.classList.add('visible');
  },400);
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft=GAME_DURATION;
  updateTimerDisplay();
  gameActive=true;
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0) endGame();
  },1000);
}

function startGame(){
  score=0;
  scoreText.textContent='0';
  gameOver.classList.remove('visible');
  shooting=false;
  dragging=false;
  keeperDiving=false;
  diveProgress=0;
  kFrac=0.5;
  kTarget=0.5;
  positionKeeper();
  setIdlePose();
  resetBall();
  startTimer();
}

function shoot(dx,dy){
  if(shooting||!gameActive)return;
  shooting=true;
  const m=getGoalMetrics();
  const rawX=m.gW/2+dx*0.85;
  const rawY=m.gH*0.87-dy*1.05;
  const targetX=Math.max(m.left-60,Math.min(m.right+60,rawX));
  const targetY=Math.max(m.top-30,Math.min(m.bottom+50,rawY));
  const tXpct=(targetX/m.gW)*100;
  const tYpct=((m.gH-targetY)/m.gH)*100;
  const shotFrac=Math.max(0,Math.min(1,(targetX-m.left)/m.width));
  // 60% chance keeper guesses right direction
  const willDive=Math.random()<0.60;

  setTimeout(()=>{
    if(willDive){
      // Dives toward shot with small error
      const error=(Math.random()*0.16)-0.08;
      kTarget=Math.max(0,Math.min(1,shotFrac+error));
      keeperDiveDir=shotFrac>0.5?1:-1;
    } else {
      // Dives wrong way
      keeperDiveDir=shotFrac>0.5?-1:1;
      kTarget=Math.max(0,Math.min(1,shotFrac>0.5?0.12:0.88));
    }
    keeperDiving=true;
    diveProgress=0;
    requestAnimationFrame(animateDive);
  },260);

  ball.style.transition='all .85s cubic-bezier(.15,.75,.2,1)';
  ball.style.left=tXpct+'%';
  ball.style.bottom=tYpct+'%';
  const sc=Math.max(.28,1-dy/900);
  ball.style.transform=`translateX(-50%) scale(${sc})`;

  setTimeout(()=>{
    const inH=(targetX>m.left&&targetX<m.right);
    const inV=(targetY>m.top&&targetY<m.bottom);
    if(!inH||!inV){
      showMessage('MISS!','#ffcc00');
    } else {
      const kRect=keeper.getBoundingClientRect();
      const gRect=document.getElementById('game').getBoundingClientRect();
      const kCx=kRect.left+kRect.width/2-gRect.left;
      const reach=kRect.width*0.58;
      const hDiff=Math.abs(kCx-targetX);
      const isTop=(targetY<m.top+(m.bottom-m.top)*0.4);
      // Top corners harder to save; low/mid shots saveable when keeper is close
      const saved=willDive&&(isTop?hDiff<reach*0.44:hDiff<reach*0.88);
      if(saved){
        showMessage('SAVED!','#ff4040');
      } else {
        score++;
        scoreText.textContent=score;
        showMessage('GOAL!','#00ff95');
      }
    }
    setTimeout(resetBall,750);
  },840);
}

function pointerDown(x,y){if(shooting||!gameActive)return;dragging=true;startX=x;startY=y;}
function pointerMove(x,y){
  if(!dragging)return;
}
function pointerUp(x,y){
  if(!dragging)return;
  dragging=false;
  const dx=x-startX,dy=startY-y;
  if(dy>8)shoot(dx,dy);
}

window.addEventListener('mousedown', e=>pointerDown(e.clientX,e.clientY));
window.addEventListener('mousemove',  e=>pointerMove(e.clientX,e.clientY));
window.addEventListener('mouseup',    e=>pointerUp(e.clientX,e.clientY));
window.addEventListener('touchstart', e=>{const t=e.touches[0];pointerDown(t.clientX,t.clientY);},{passive:false});
window.addEventListener('touchmove',  e=>{const t=e.touches[0];pointerMove(t.clientX,t.clientY);},{passive:false});
window.addEventListener('touchend',   e=>{const t=e.changedTouches[0];pointerUp(t.clientX,t.clientY);},{passive:false});

restartBtn.addEventListener('click', startGame);
restartBtn.addEventListener('touchend', e=>{e.preventDefault();startGame();});
playBtn.addEventListener('click', startGame);
playBtn.addEventListener('touchend', e=>{e.preventDefault();startGame();});

// Init keeper position but don't start — wait for Play
positionKeeper();
setIdlePose();
</script>

    splash.classList.add("fade-out");
    setTimeout(() => {
        splash.remove();
        document.body.classList.add("splash-done");
    }, 500);
});
</script>
